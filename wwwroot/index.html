<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>QuickproPos</title>
    <base href="/" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/rtl.css" />
    <link rel="stylesheet" href="css/payment-section.css" />
    <link rel="stylesheet" href="QuickproPos.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body dir="rtl" style="font-family: 'Cairo', sans-serif;">

    <div class="status-bar-safe-area"></div>

    <div id="app" dir="rtl" style="font-family: 'Cairo', sans-serif;">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;">
            <div style="text-align: center;">
                <div style="font-size: 24px; margin-bottom: 20px;">🚀 Soft Solutions</div>
                <div style="font-size: 16px; color: #666;">جاري تحميل التطبيق...</div>
                <div style="margin-top: 20px;">
                    <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" dir="rtl" style="font-family: 'Cairo', sans-serif; position: fixed; top: 0; left: 0; right: 0; background: #dc3545; color: white; padding: 10px; text-align: center; z-index: 9999; display: none;">
        حدث خطأ غير متوقع في التطبيق.
        <a href="" class="reload" style="color: white; text-decoration: underline; margin-left: 10px;">إعادة تحميل</a>
        <a class="dismiss" style="color: white; margin-left: 10px; cursor: pointer;">🗙</a>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #blazor-error-ui .dismiss {
            cursor: pointer;
            position: absolute;
            right: 0.75rem;
            top: 0.5rem;
        }
    </style>

    <!-- معالج الأخطاء أولاً -->
    <script src="js/error-handler.js"></script>
    
    <!-- إصلاح مشكلة Blazor المتكرر -->
    <script src="js/blazor-fix.js"></script>
    
    <!-- تحميل jQuery أولاً -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- تحميل Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- تحميل Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- تحميل html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- تحميل Print.js -->
    <script src="https://printjs-4de6.kxcdn.com/print.min.js"></script>
    
    <!-- تحميل ملفات JavaScript المخصصة -->
    <script src="js/print.js"></script>
    <script src="js/script.js"></script>
    <script type="module" src="js/printing.js"></script>
    <script type="module" src="js/scripts.js"></script>
    
    <!-- تحميل MudBlazor -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    
    <!-- تحميل Blazor في النهاية -->
    <script src="_framework/blazor.webview.js"></script>
    
    <script>
        // متغير عام لمنع بدء Blazor أكثر من مرة
        window.blazorStarted = false;
        
        // دالة لتشغيل الصوت عند إضافة منتج
        window.UpdateTodoList = function(soundPath) {
            try {
                var audio = new Audio(soundPath);
                audio.volume = 0.5; // مستوى الصوت 50%
                audio.play().catch(function(error) {
                    console.log('خطأ في تشغيل الصوت:', error);
                });
            } catch (error) {
                console.log('خطأ في إنشاء الصوت:', error);
            }
        };

        // معالجة أخطاء JavaScript العامة
        window.addEventListener('error', function(event) {
            var errorMessage = event.message || '';
            
            // تجاهل خطأ Blazor المتكرر
            if (errorMessage.includes('Blazor has already started')) {
                console.warn('تحذير: محاولة بدء Blazor أكثر من مرة - تم تجاهل الخطأ');
                event.preventDefault();
                return true;
            }
            
            console.error('خطأ JavaScript:', event.error);
            return false;
        });

        // معالجة أخطاء Promise
        window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason || {};
            var message = reason.message || reason.toString();
            
            // تجاهل خطأ Blazor المتكرر في Promise
            if (message.includes('Blazor has already started')) {
                console.warn('تحذير: محاولة بدء Blazor أكثر من مرة في Promise - تم تجاهل الخطأ');
                event.preventDefault();
                return;
            }
            
            console.error('خطأ Promise:', event.reason);
        });

        // معالجة أحداث DOM
        window.addEventListener('DOMContentLoaded', function () {
            console.log('🚀 بدء تحميل التطبيق...');
            
            // إخفاء رسالة الخطأ في البداية
            var errorUI = document.getElementById('blazor-error-ui');
            if (errorUI) {
                errorUI.style.display = 'none';
            }
            
            // معالجة النقر على زر الإغلاق
            document.addEventListener('click', function (event) {
                if (event.target.classList.contains('dismiss')) {
                    var errorUI = document.getElementById('blazor-error-ui');
                    if (errorUI) {
                        errorUI.style.display = 'none';
                    }
                }
            });
        });

        // التحقق من تحميل Blazor
        var blazorCheckInterval = setInterval(function() {
            if (window.Blazor && !window.blazorStarted) {
                console.log('✅ تم تحميل Blazor بنجاح');
                window.blazorStarted = true;
                clearInterval(blazorCheckInterval);
            }
        }, 1000);
        
        // التحقق من تحميل printJS
        var printJSCheckInterval = setInterval(function() {
            if (window.printJS) {
                console.log('✅ تم تحميل printJS بنجاح');
                clearInterval(printJSCheckInterval);
            }
        }, 1000);
        
        // إيقاف التحقق بعد 10 ثواني
        setTimeout(function() {
            clearInterval(printJSCheckInterval);
            if (!window.printJS) {
                console.warn('⚠️ لم يتم تحميل printJS - سيتم استخدام الطباعة العادية');
            }
        }, 10000);

        // إظهار رسالة خطأ إذا لم يتم تحميل Blazor خلال 30 ثانية
        setTimeout(function() {
            if (!window.Blazor || !window.blazorStarted) {
                console.error('❌ فشل في تحميل Blazor');
                var errorUI = document.getElementById('blazor-error-ui');
                if (errorUI) {
                    errorUI.style.display = 'block';
                }
            }
            clearInterval(blazorCheckInterval);
        }, 30000);
    </script>
</body>

</html>
